# Render Blueprint — deploys apps/api (web service) from this pnpm workspace
# monorepo. apps/worker (the BullMQ background worker) is deliberately NOT
# deployed here: Render has no free plan for background workers at all
# (smallest paid tier is ~$7/month), and the worker's job — marking
# Conversation.processedAt and writing one extra AuditEvent — is best-effort
# background processing behind an already-durable queue enqueue, never on
# the path of any Phase 1-4 API response (see apps/api/src/services/
# enquiryService.ts and ARCHITECTURE.md's Phase 1 flow diagram: the queue
# job is enqueued *after* the request's own transaction commits and the
# response is already being returned). So every Phase 1-4 endpoint keeps
# working exactly as before with the worker simply never running; queued
# jobs sit in Redis unconsumed instead of erroring. Add an ai-concierge-worker
# service back (see git history for the exact config) whenever that
# background step, or a real Event/Workflow Engine that depends on it, is
# actually needed.
#
# Free-tier notes (see Render's own pricing/limits page for current numbers):
#   - ai-concierge-db (Postgres, free): 1 GB, auto-expires 30 days after
#     creation unless upgraded to a paid plan.
#   - ai-concierge-redis (Key Value, free): 25 MB, no persistence (data is
#     lost on restart) — fine for a BullMQ queue where jobs can be re-enqueued,
#     not fine for anything that needs Redis as durable storage.
#   - ai-concierge-api (web, free): spins down after 15 min with no inbound
#     traffic; next request wakes it up (~1 min cold start).

databases:
  - name: ai-concierge-db
    plan: free
    region: oregon
    postgresMajorVersion: '16'

services:
  - type: keyvalue
    name: ai-concierge-redis
    plan: free
    region: oregon
    ipAllowList: []

  - type: web
    name: ai-concierge-api
    runtime: node
    plan: free
    region: oregon
    # Runs the Postgres migration on every deploy (prisma migrate deploy only
    # ever applies pending migrations, so this is safe to re-run every time,
    # including when there's nothing new to apply) — otherwise a fresh
    # ai-concierge-db has no tables and every request fails.
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @ai-concierge/api... run build && pnpm --filter @ai-concierge/db run migrate:deploy
    startCommand: node apps/api/dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ai-concierge-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ai-concierge-redis
          property: connectionString
      - key: WEBHOOK_SIGNING_SECRET
        sync: false
      # Must match a real seeded Tenant row.
      - key: DEFAULT_TENANT_ID
        sync: false
      # Render assigns the public URL only after the first deploy; set this
      # to that URL (dashboard -> ai-concierge-api -> the onrender.com URL).
      - key: API_PUBLIC_URL
        sync: false
      # Comma-separated list of origins allowed to call this API (e.g. the
      # deployed apps/web URL).
      - key: CORS_ALLOWED_ORIGINS
        sync: false
