# Render Blueprint for the full system: API, background worker, and web
# frontend. Deploying only the first service (ai-concierge-api) gets you
# every HTTP endpoint (Steps 1-4) working, but two things silently won't:
#   - the BullMQ post-enquiry job never gets consumed, so
#     conversation.processedAt and its audit event never get written
#     (Phase 1's enqueue is "best-effort" — it doesn't fail the request,
#     it just has nothing listening on the other end)
#   - there is no browser UI at all — only the raw JSON API
# The worker and web services below close both gaps. Deploy all three
# together (Render dashboard -> New + -> Blueprint, point at this repo) for
# every feature to actually work end to end.
#
# This is a pnpm workspace monorepo, so Render's zero-config Node detection
# (which just runs `npm install` / `npm start` at the repo root) does not
# work — the root package.json intentionally has no "start" script, since
# nothing runnable lives at the repo root itself. Every service below has
# its own explicit build/start command instead.
#
# If you already created a Web Service manually, either delete it and
# redeploy via Blueprint, or copy the relevant service's
# buildCommand/startCommand/envVars from here into its Settings page.

services:
  - type: web
    name: ai-concierge-api
    runtime: node
    plan: free
    buildCommand: corepack enable && corepack prepare pnpm@10.33.0 --activate && pnpm install --frozen-lockfile && pnpm run build
    # `prisma migrate deploy` only applies pending migrations, so it's safe
    # to re-run on every start; the more correct place for it long-term is
    # Render's own "Pre-Deploy Command" setting, once you're on a plan that
    # has it.
    startCommand: pnpm --filter @ai-concierge/db exec prisma migrate deploy && node apps/api/dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      # Fill these in from the Render dashboard after the first deploy —
      # either a Render-managed Postgres/Redis instance, or an external one
      # (e.g. Neon, Upstash). Both ai-concierge-api and ai-concierge-worker
      # must point at the *same* Postgres and Redis. Never commit real
      # values for these.
      - key: DATABASE_URL
        sync: false
      # BullMQ needs this Redis reachable with maxmemory-policy=noeviction —
      # any eviction policy (Render's free Key Value plan defaults to
      # allkeys-lru) lets Redis silently drop queued job keys under memory
      # pressure. Set it in the provider's dashboard/config; both services
      # log a startup warning (and BullMQ prints its own) when it's wrong.
      - key: REDIS_URL
        sync: false
      # Generated once by Render and stored as a secret; never visible here.
      - key: WEBHOOK_SIGNING_SECRET
        generateValue: true
      # Matches the single-tenant default used throughout local dev/tests
      # (.env.example, packages/testing) until real tenant onboarding exists.
      - key: DEFAULT_TENANT_ID
        value: 00000000-0000-0000-0000-000000000001
      - key: OUTBOUND_ALLOWED_HOSTS
        value: localhost,127.0.0.1
      # Set this to ai-concierge-web's real Render URL once it's deployed
      # (the localhost default is meaningless in production).
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Cosmetic only (the "try it out" base URL shown in /docs) — set to
      # this service's own real Render URL once you know it.
      - key: API_PUBLIC_URL
        sync: false
      # PORT is provided automatically by Render; apps/api/src/env.ts
      # adopts it into API_PORT when API_PORT itself isn't set.
      # Meta WhatsApp Cloud API — all four optional; the webhook and outbound
      # replies report NOT_CONFIGURED until every one of them is set. Values
      # come from the Meta App Dashboard, not generated by Render:
      #   WHATSAPP_ACCESS_TOKEN    System User permanent access token
      #   WHATSAPP_PHONE_NUMBER_ID from WhatsApp > API Setup for your number
      #   WHATSAPP_VERIFY_TOKEN    any string you choose; re-enter the same
      #                            value in the dashboard's webhook setup
      #   WHATSAPP_APP_SECRET      App Dashboard > Settings > Basic
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      # Gemini — conversational reply generation only; leave unset to keep
      # the adapter NOT_CONFIGURED (see .env.example). Get a key at
      # https://aistudio.google.com/apikey. GEMINI_MODEL_ID/TEMPERATURE/etc.
      # have safe defaults in code and don't need to be set here.
      - key: GEMINI_API_KEY
        sync: false

  - type: worker
    name: ai-concierge-worker
    runtime: node
    plan: free
    buildCommand: corepack enable && corepack prepare pnpm@10.33.0 --activate && pnpm install --frozen-lockfile && pnpm run build
    startCommand: node apps/worker/dist/worker.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      # Must be the *same* database/queue the API service uses above.
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: WEBHOOK_SIGNING_SECRET
        generateValue: true
      - key: DEFAULT_TENANT_ID
        value: 00000000-0000-0000-0000-000000000001
      - key: OUTBOUND_ALLOWED_HOSTS
        value: localhost,127.0.0.1

  - type: web
    name: ai-concierge-web
    runtime: node
    plan: free
    buildCommand: corepack enable && corepack prepare pnpm@10.33.0 --activate && pnpm install --frozen-lockfile && pnpm run build
    startCommand: pnpm --filter @ai-concierge/web start
    envVars:
      - key: NODE_ENV
        value: production
      # Set this to ai-concierge-api's real Render URL once it's deployed —
      # this is the server-side base URL the Next.js server proxies to, never
      # exposed to the browser. The localhost default will not work here.
      - key: INTERNAL_API_BASE_URL
        sync: false
      # Must include ai-concierge-api's real hostname (e.g.
      # ai-concierge-api.onrender.com) — ssrfSafeFetch refuses to call
      # anything not on this list, so leaving the localhost default here
      # would make the web UI unable to reach the deployed API at all.
      - key: OUTBOUND_ALLOWED_HOSTS
        sync: false
      # Next.js reads PORT natively; no equivalent fix to apps/api's is needed.
